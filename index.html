<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X لȺȺͲ ͲƐȺⱮ - Key Receiver</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@1,700;1,900&display=swap');

    :root {
      --bg-color: #030708;
      --card-bg: rgba(10, 15, 20, 0.90);
      --primary-neon: #00ff66;
      --secondary-neon: #00d2ff;
      --text-color: #ffffff;
      --text-dim: #00cc55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Empire', 'Cinzel', 'Consolas', monospace, sans-serif;
      font-weight: bold !important;
      font-style: italic !important;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 255, 102, 0.4);
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.25), inset 0 0 15px rgba(0, 255, 102, 0.1);
      backdrop-filter: blur(8px);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00ff66, #00d2ff, #00ff66);
      background-size: 300% 300%;
      animation: rgbBorder 3s linear infinite;
      border-radius: 16px 16px 0 0;
    }

    .circle-avatar-container {
      width: 125px;
      height: 125px;
      margin: 10px auto 15px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(90deg, #00ff66, #00d2ff, #00ff66);
      background-size: 300% 300%;
      animation: rgbBorder 3s linear infinite;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
    }

    .circle-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #050a0e;
      display: block;
    }

    .rgb-title {
      font-size: 2.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #00ff2b, #007aff, #7a00ff, #ff00c8, #ff0000);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rgbGlow 3s ease infinite;
      filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.5));
    }

    @keyframes rgbGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes rgbBorder {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .otp-display-box {
      margin: 20px 0;
      padding: 20px 10px;
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px dashed var(--primary-neon);
      border-radius: 12px;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .otp-code {
      font-size: clamp(2rem, 9vw, 3rem);
      letter-spacing: 8px;
      color: #00ff66;
      text-shadow: 0 0 15px rgba(0, 255, 102, 0.9);
      white-space: nowrap;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-copy {
      background: rgba(0, 255, 102, 0.1);
      color: var(--primary-neon);
      border: 1px solid var(--primary-neon);
    }

    .btn-copy:hover {
      background: var(--primary-neon);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
    }

    .status-msg {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #00ff66;
      min-height: 20px;
    }

    .not-found-box {
      padding: 40px 10px;
    }

    .not-found-title {
      font-size: 2.5rem;
      color: #ff4757;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
      margin-bottom: 10px;
    }

    .not-found-sub {
      color: #ff4757;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <div class="container" id="mainContainer">
    <div class="circle-avatar-container">
      <img src="https://i.ibb.co/VcgrHxGC/logo.jpg" alt="Circle Pic" class="circle-avatar-img">
    </div>

    <h2 class="rgb-title">X لȺȺͲ ͲƐȺⱮ</h2>

    <div id="contentArea">
      <div class="otp-display-box">
        <div class="otp-code" id="otpDisplay">----</div>
      </div>

      <button class="btn btn-copy" id="copyBtn" onclick="copyOTP()">COPY KEY</button>
      <div class="status-msg" id="statusMsg">Loading Key...</div>
    </div>
  </div>

  <script>
    /* Hacker Matrix Background Animation */
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0110010101010101010101001001010101010100100101010101010101';
    const fontSize = 14;
    const columns = Math.floor(window.innerWidth / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 7, 8, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff66';
      ctx.font = 'bold italic ' + fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    /* Direct URL Key Extraction Function */
    function getKeyFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('key') || urlParams.get('otp') || urlParams.get('id') || urlParams.get('req');
    }

    function showNotFound() {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = `
        <div class="not-found-box">
          <div class="not-found-title">404</div>
          <div class="not-found-sub">NO KEY FOUND IN LINK</div>
        </div>
      `;
    }

    window.onload = function() {
      const extractedKey = getKeyFromURL();
      const otpDisplay = document.getElementById('otpDisplay');
      const statusMsg = document.getElementById('statusMsg');

      if (extractedKey) {
        otpDisplay.innerText = extractedKey;
        statusMsg.innerText = "Key Generated Successfully!";
        statusMsg.style.color = "#00ff66";
      } else {
        showNotFound();
      }
    };

    function copyOTP() {
      const otpText = document.getElementById('otpDisplay').innerText;
      const statusMsg = document.getElementById('statusMsg');

      if (!otpText || otpText === '----') {
        statusMsg.innerText = "No key available to copy!";
        statusMsg.style.color = "#ff4757";
        return;
      }

      navigator.clipboard.writeText(otpText).then(() => {
        statusMsg.innerText = "Key Copied Successfully!";
        statusMsg.style.color = "#00ff66";
      }).catch(() => {
        statusMsg.innerText = "Failed to copy key.";
        statusMsg.style.color = "#ff4757";
      });
    }
  </script>
</body>
</html>
