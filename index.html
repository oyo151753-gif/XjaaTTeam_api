<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X لȺȺͲ ͲƐȺⱮ - Terminal Key Receiver</title>
  
  <!-- Cyberpunk & Hacker Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #020508;
      --card-bg: rgba(6, 12, 18, 0.92);
      --neon-green: #00ff66;
      --neon-cyan: #00f0ff;
      --neon-red: #ff0055;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
      font-family: 'Share Tech Mono', monospace;
    }

    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* --- CYBER CARD CONTAINER --- */
    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 255, 102, 0.3);
      padding: 30px 24px;
      box-shadow: 0 0 35px rgba(0, 255, 102, 0.15), inset 0 0 20px rgba(0, 255, 102, 0.05);
      backdrop-filter: blur(10px);
      text-align: center;
      position: relative;
      z-index: 2;
      clip-path: polygon(0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px));
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-green), var(--neon-cyan), transparent);
      animation: scanBorder 3s linear infinite;
    }

    @keyframes scanBorder {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .circle-avatar-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
      animation: pulseGlow 2.5s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
      100% { box-shadow: 0 0 30px rgba(0, 240, 255, 0.8); }
    }

    .circle-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #050a0e;
      display: block;
    }

    /* --- HACKER INTRO TITLE STYLING --- */
    .title-wrapper {
      margin-bottom: 20px;
    }

    .hacker-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6rem, 5.5vw, 2.2rem);
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-green);
      display: inline-block;
      min-height: 2.5rem;
    }

    .cyber-badge {
      font-size: 0.75rem;
      color: var(--neon-cyan);
      letter-spacing: 3px;
      margin-top: 2px;
      text-shadow: 0 0 8px var(--neon-cyan);
      opacity: 0.85;
    }

    /* --- UNIK HUD BOX DESIGN --- */
    .hud-box {
      margin: 22px 0;
      padding: 24px 15px;
      background: radial-gradient(circle, rgba(0,255,102,0.06) 0%, rgba(2,10,15,0.98) 100%);
      border: 1px solid rgba(0, 255, 102, 0.4);
      position: relative;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.1);
      clip-path: polygon(0 15px, 15px 0, calc(100% - 15px) 0, 100% 15px, 100% calc(100% - 15px), calc(100% - 15px) 100%, 15px 100%, 0 calc(100% - 15px));
      overflow: hidden;
    }

    /* HUD Corner Brackets */
    .hud-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--neon-cyan);
      border-style: solid;
    }
    .corner-tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
    .corner-tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

    /* Laser Scanner Bar */
    .laser-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-green), var(--neon-cyan), transparent);
      box-shadow: 0 0 12px var(--neon-green);
      animation: laserScan 2s ease-in-out infinite alternate;
      z-index: 4;
    }

    @keyframes laserScan {
      0% { top: 0%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 96%; opacity: 0.3; }
    }

    /* --- UNIK HACKER FONT KEY DISPLAY --- */
    .hud-key-text {
      font-family: 'VT323', monospace;
      font-size: clamp(3rem, 12vw, 4.2rem);
      color: var(--neon-green);
      letter-spacing: 12px;
      text-shadow: 0 0 12px var(--neon-green), 0 0 30px rgba(0, 255, 102, 0.8);
      position: relative;
      z-index: 3;
      filter: drop-shadow(3px 3px 0px var(--neon-red));
      display: inline-block;
      animation: neonPulse 1.5s infinite alternate;
    }

    @keyframes neonPulse {
      0% { transform: scale(1); text-shadow: 0 0 10px var(--neon-green); }
      100% { transform: scale(1.03); text-shadow: 0 0 20px var(--neon-green), 0 0 35px var(--neon-cyan); }
    }

    /* --- CYBER CUT BUTTON --- */
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-cyber {
      background: linear-gradient(135deg, rgba(0, 255, 102, 0.15), rgba(0, 240, 255, 0.15));
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    }

    .btn-cyber:hover {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 25px var(--neon-green);
    }

    .status-msg {
      margin-top: 15px;
      font-size: 0.85rem;
      color: var(--neon-green);
      letter-spacing: 1px;
      min-height: 20px;
    }

    .not-found-box {
      padding: 40px 10px;
    }

    .not-found-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      color: var(--neon-red);
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
      margin-bottom: 10px;
    }

    .not-found-sub {
      color: var(--neon-red);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <div class="container">
    <div class="circle-avatar-container">
      <img src="https://i.ibb.co/VcgrHxGC/logo.jpg" alt="Logo" class="circle-avatar-img">
    </div>

    <!-- HACKER TITLE WITH INTRO ANIMATION -->
    <div class="title-wrapper">
      <h2 class="hacker-title" id="hackerTitle"></h2>
      <div class="cyber-badge">[ SYSTEM STATUS: ONLINE ]</div>
    </div>

    <div id="contentArea">
      <!-- HUD SCANNER BOX -->
      <div class="hud-box">
        <div class="hud-corner corner-tl"></div>
        <div class="hud-corner corner-tr"></div>
        <div class="hud-corner corner-bl"></div>
        <div class="hud-corner corner-br"></div>
        <div class="laser-line"></div>

        <div class="hud-key-text" id="otpDisplay">----</div>
      </div>

      <button class="btn btn-cyber" onclick="copyOTP()">[ COPY KEY ]</button>
      <div class="status-msg" id="statusMsg">INITIALIZING...</div>
    </div>
  </div>

  <script>
    /* Hacker Matrix Background */
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0110010101010101010101001001010101010100100101010101010101';
    const fontSize = 14;
    const columns = Math.floor(window.innerWidth / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(2, 5, 8, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff66';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    /* --- HACKER MATRIX TEXT DECRYPT SCRAMBLE ANIMATION --- */
    function scrambleEffect(elementId, finalText, duration = 1500) {
      const el = document.getElementById(elementId);
      const possibleChars = '!@#$%^&*()_+-=[]{}|;:,.<>?/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const steps = 25;
      const stepDuration = duration / steps;
      let currentStep = 0;

      const interval = setInterval(() => {
        currentStep++;
        let output = '';

        for (let i = 0; i < finalText.length; i++) {
          if (finalText[i] === ' ') {
            output += ' ';
          } else if (currentStep / steps > (i + 1) / finalText.length) {
            output += finalText[i];
          } else {
            output += possibleChars[Math.floor(Math.random() * possibleChars.length)];
          }
        }

        el.innerText = output;

        if (currentStep >= steps) {
          el.innerText = finalText;
          clearInterval(interval);
        }
      }, stepDuration);
    }

    /* URL Parameter Extraction */
    function getKeyFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('key') || urlParams.get('otp') || urlParams.get('id') || urlParams.get('req');
    }

    function showNotFound() {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = `
        <div class="not-found-box">
          <div class="not-found-title">404</div>
          <div class="not-found-sub">KEY PARAMETER MISSING IN LINK</div>
        </div>
      `;
    }

    window.onload = function() {
      // 1. Run Tagra Title Decrypt Animation
      scrambleEffect('hackerTitle', 'X لȺȺͲ ͲƐȺⱮ', 1800);

      const extractedKey = getKeyFromURL();
      const statusMsg = document.getElementById('statusMsg');

      if (extractedKey) {
        // 2. Run Matrix Number Counter Reveal for Key Display
        setTimeout(() => {
          scrambleEffect('otpDisplay', extractedKey, 1200);
          statusMsg.innerText = "KEY DECRYPTED SUCCESSFULLY!";
          statusMsg.style.color = "#00ff66";
        }, 300);
      } else {
        setTimeout(() => {
          showNotFound();
        }, 500);
      }
    };

    function copyOTP() {
      const otpText = document.getElementById('otpDisplay').innerText;
      const statusMsg = document.getElementById('statusMsg');

      if (!otpText || otpText === '----') {
        statusMsg.innerText = "NO KEY TO COPY!";
        statusMsg.style.color = "#ff0055";
        return;
      }

      navigator.clipboard.writeText(otpText).then(() => {
        statusMsg.innerText = "KEY COPIED TO CLIPBOARD!";
        statusMsg.style.color = "#00ff66";
      }).catch(() => {
        statusMsg.innerText = "FAILED TO COPY KEY.";
        statusMsg.style.color = "#ff0055";
      });
    }
  </script>
</body>
</html>
